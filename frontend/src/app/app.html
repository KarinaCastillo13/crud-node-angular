
<h2>Agregar usuario</h2>

<form #f="ngForm" (ngSubmit)="crearUsuario(f)" novalidate>

  <input
    type="text"
    name="nombre"
    [(ngModel)]="nuevoUsuario.nombre"
    placeholder="Nombre"
    required
  />

  <input
    type="email"
    name="correo"
    [(ngModel)]="nuevoUsuario.correo"
    placeholder="Correo"
    required
  />

  <input
    type="text"
    name="telefono"
    [(ngModel)]="nuevoUsuario.telefono"
    placeholder="Teléfono"
    required
  />

  <button
    pButton
    type="submit"
    label="Guardar"
    [disabled]="f.invalid">
  </button>

</form>


<div *ngIf="usuarioEditando" class="edit-form">
  <h3>Editar Usuario</h3>

  <input type="text" [(ngModel)]="usuarioEditando.nombre" placeholder="Nombre">
  <input type="email" [(ngModel)]="usuarioEditando.correo" placeholder="Correo">
  <input type="text" [(ngModel)]="usuarioEditando.telefono" placeholder="Teléfono">

  <button pButton label="Guardar" (click)="guardarEdicion()"></button>
  <button pButton 
          label="Cancelar" 
          class="p-button-secondary"
          (click)="cancelarEdicion()">
  </button>
</div>

<hr />

<h2>Lista de usuarios</h2>

<p-table [value]="usuarios">
  <ng-template pTemplate="header">
    <tr>
      <th>Nombre</th>
      <th>Correo</th>
      <th>Teléfono</th>
      <th>Acciones</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-u>
    <tr>
      <td>{{ u.nombre }}</td>
      <td>{{ u.correo }}</td>
      <td>{{ u.telefono }}</td>
      <td>
        <button pButton 
                icon="pi pi-trash" 
                class="p-button-danger p-button-sm"
                (click)="eliminarUsuario(u.id)">
        </button>

        <button pButton 
        icon="pi pi-pencil" 
        class="p-button-warning p-button-sm"
        (click)="editarUsuario(u)">
        </button>

      </td>
    </tr>
  </ng-template>
</p-table>
